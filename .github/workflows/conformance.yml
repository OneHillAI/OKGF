name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the okgf package (with dev + verify extras)
        run: python -m pip install -e ".[dev]"
      - name: Validate example bundles with the okgf command (strict, with signature verification)
        run: |
          okgf --strict --pubkey examples/governed/ORG_PUBKEY.pem examples/governed
          okgf --strict examples/minimal
      - name: Back-compat shim still validates
        run: python tools/okgf_validate.py --strict examples/minimal
      - name: Run tests
        run: python -m pytest tests/ -q

  # Stable required-status context. Branch protection requires the single check
  # `validate`; this gate passes only when every `test` matrix leg (3.9, 3.12)
  # passes, so the required check name does not change with the matrix.
  validate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All conformance matrix legs passed."
