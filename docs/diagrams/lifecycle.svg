<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" width="720" height="196" role="img" aria-label="The OKGF review lifecycle: a page moves draft, then proposed, then approved; a rejected page returns to draft. A page is authoritative only when approved.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9096"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9772a"/>
    </marker>
    <style>
      .word { font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1f2328; }
      .cap  { font: 400 11px ui-monospace, "SF Mono", Menlo, monospace; fill: #6b7280; letter-spacing: .04em; }
      .edge { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; fill: #6b7280; letter-spacing: .03em; }
      .goldcap { fill: #8a5c1b; }
    </style>
  </defs>

  <!-- self-contained light canvas so text reads on both light and dark GitHub themes -->
  <rect x="4" y="4" width="712" height="188" rx="14" fill="#fbfaf7" stroke="#e6e3db"/>

  <!-- draft -->
  <rect x="44" y="60" width="150" height="58" rx="9" fill="#ffffff" stroke="#cdd2d6"/>
  <text x="119" y="86" text-anchor="middle" class="word">draft</text>
  <text x="119" y="104" text-anchor="middle" class="cap">authored</text>

  <!-- proposed -->
  <rect x="285" y="60" width="150" height="58" rx="9" fill="#ffffff" stroke="#cdd2d6"/>
  <text x="360" y="86" text-anchor="middle" class="word">proposed</text>
  <text x="360" y="104" text-anchor="middle" class="cap">in review</text>

  <!-- approved (authoritative) -->
  <rect x="526" y="60" width="150" height="58" rx="9" fill="#f6efe1" stroke="#a9772a" stroke-width="1.5"/>
  <text x="601" y="86" text-anchor="middle" class="word">approved</text>
  <text x="601" y="104" text-anchor="middle" class="cap goldcap">authoritative</text>

  <!-- propose: draft -> proposed -->
  <line x1="198" y1="89" x2="279" y2="89" stroke="#8b9096" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="80" text-anchor="middle" class="edge">propose</text>

  <!-- approve: proposed -> approved (gold, the promotion) -->
  <line x1="439" y1="89" x2="520" y2="89" stroke="#a9772a" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <text x="480" y="80" text-anchor="middle" class="edge goldcap">approve</text>

  <!-- reject: proposed -> draft, curved below -->
  <path d="M300,122 C300,162 200,162 168,130" fill="none" stroke="#8b9096" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="211" y="146" width="54" height="16" rx="3" fill="#fbfaf7"/>
  <text x="238" y="158" text-anchor="middle" class="edge">reject</text>
</svg>
